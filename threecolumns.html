<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f8ef7">
    <title>Registro</title>
</head>
    <body>

        <div class="container">

            <header>
                <h1>Las tres columnas</h1>
                <p>Identifica el pensamiento, la distorsión y una respuesta alternativa.</p>
            </header>

            <main>
                <form class="threeColumnsForm" autocomplete="off">

            <section>
                <h2>La crítica</h2>

                <label for="critica">
                    Escribe el pensamiento negativo que has tenido sobre ti (ej: "He cometido un error en la reunión y soy un desastre").
                </label>

                <textarea
                    id="critica"
                    name="critica"
                    rows="5"
                ></textarea>
            </section>

            <section>
                <h2>La distorsión</h2>

                <label for="distorsion">
                    Identifica el error de lógica. En este caso, estás generalizando un fallo puntual a toda tu persona.
                </label>

                <textarea
                    id="distorsion"
                    name="distorsion"
                    rows="5"
                ></textarea>
            </section>

            <section>
                <h2>Respuesta compasiva</h2>

                <label for="respuesta_compasiva">
                    Responde con hechos objetivos y amabilidad (ej: "Cometer un error no me define; he solucionado problemas similares antes y hoy he hecho lo mejor que he podido").
                </label>

                <textarea
                    id="respuesta_compasiva"
                    name="respuesta_compasiva"
                    rows="5"
                ></textarea>
            </section>

            <button type="submit">
                Guardar registro
            </button>
        </form>
        </main>

        <footer class="appFooter">

            <a href="index.html">Registro</a>

            <a href="threecolumns.html">3 Columnas</a>

            <a href="patients.html">Profesional</a>

        </footer>

        <div id="toast" class="toast">Guardado correctamente</div>

        <script src="script.js"></script>

    </div>

</body>
</html>
