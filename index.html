<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f8ef7">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <title>Registro</title>
</head>
<body>
  <div class="container">
    <header>
        <h1>Registro</h1>
        <p>Completa los siguientes campos.</p>
    </header>
    <button id="logout">Cerrar sesión</button>
    <main>

        <form class="recordForm" autocomplete="off">

            <section>
                <h2>Disparador</h2>

                <label for="trigger">
                    Acontecimiento desencadenante del malestar, qué ha pasado o qué tenía que pasar y no se ha dado
                </label>

                <textarea
                    id="trigger"
                    name="trigger"
                    rows="5"
                ></textarea>
            </section>

            <section>
                <h2>Imagen</h2>

                <label for="image">
                    ¿Qué imagen o escena se ha formado en nuestra mente? ¿Qué ves o te imaginas cuando recuerdas la situación al cerrar los ojos?
                </label>

                <textarea
                    id="image"
                    name="image"
                    rows="5"
                ></textarea>
            </section>

            <section>
                <h2>Cognición</h2>

                <label for="cognition">
                    ¿Qué pensamiento o creencia ha provocado en ti?
                </label>

                <textarea
                    id="cognition"
                    name="cognition"
                    rows="5"
                ></textarea>
            </section>

            <section>
                <h2>Emoción</h2>

                <label for="emotion">
                    ¿Qué emoción has sentido en esa situación perturbadora?
                </label>

                <textarea
                    id="emotion"
                    name="emotion"
                    rows="3"
                ></textarea>
            </section>

            <section>
                <h2>Sensación</h2>

                <label for="sensation">
                    ¿Qué nivel de perturbación has sentido?
                </label>
                <p>
                  0 = ninguna<br>
                  10 = la máxima que puedes imaginar
                </p>

                <input
                    type="range"
                    id="sensation"
                    name="sensation"
                    min="0"
                    max="10"
                    value="0"
                >
            </section>

            <button type="submit">
                Guardar registro
            </button>
        </form>
        <footer class="appFooter">

    <a href="index.html">Registro</a>

    <a href="threecolumns.html">3 Columnas</a>

    <a href="patients.html">Profesional</a>

</footer>
    </main>
  </div>
  <div id="toast" class="toast">Guardado correctamente</div>
    <script src="script.js"></script>

<script type="module">
    import { collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    import { auth, db } from "./firebase.js";

    const recordForm = document.querySelector(".recordForm");

    recordForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const user = auth.currentUser;

        if (!user) {
            window.location.href = "login.html";
            return;
        }

        const trigger = document.querySelector("#trigger").value;
        const image = document.querySelector("#image").value;
        const cognition = document.querySelector("#cognition").value;
        const emotion = document.querySelector("#emotion").value;
        const sensation = document.querySelector("#sensation").value;

        await addDoc(collection(db, "records"), {
            patientId: user.uid,
            trigger: trigger,
            image: image,
            cognition: cognition,
            emotion: emotion,
            sensation: Number(sensation),
            date: serverTimestamp()
        });

        recordForm.reset();
    });
</script>
  <script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

<script type="module">
    import { signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { auth } from "./firebase.js";

    document.querySelector("#logout").addEventListener("click", async function() {
        await signOut(auth);
        window.location.href = "login.html";
    });
</script>
</body>
</html>
