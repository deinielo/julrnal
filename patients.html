<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f8ef7">
    <title>Pacientes</title>
</head>
    <body>
        <div class="container">
            <header>
                <h1>Pacientes</h1>
                <p>Selecciona un paciente para ver sus registros</p>
            </header>
            <button id="logout">Cerrar sesión</button>
<main id="patientsList">
</main>
                    <footer class="appFooter">

    <a href="index.html">Registro</a>

    <a href="threecolumns.html">3 Columnas</a>

    <a href="patients.html">Profesional</a>

</footer>
        </div>
        
       <script type="module">
    import { onAuthStateChanged, signOut } 
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import { doc, getDoc, collection, getDocs, query, where, orderBy }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    import { auth, db } from "./firebase.js";

    onAuthStateChanged(auth, async function(user) {
        if (!user) {
            window.location.href = "login.html";
            return;
        }

        const userDoc = await getDoc(doc(db, "users", user.uid));

        if (userDoc.exists()) {
            const role = userDoc.data().role;

            if (role !== "pro") {
                window.location.href = "index.html";
                return;
            }

            const patientsQuery = query(
                collection(db, "users"),
                where("role", "==", "user")
            );

            const snapshot = await getDocs(patientsQuery);

            const patientsList = document.querySelector("#patientsList");
            patientsList.innerHTML = "";

            for (const patient of snapshot.docs) {
    

    const data = patient.data();

    const recordsQuery = query(
    collection(db, "records"),
    where("patientId", "==", patient.id),
    orderBy("date", "desc")
);

const recordsSnapshot = await getDocs(recordsQuery);
const recordsCount = recordsSnapshot.size;
const lastRecord = recordsSnapshot.docs[0];
let lastRecordDate = null;

if (lastRecord) {
    lastRecordDate = lastRecord.data().date.toDate();
}


    patientsList.innerHTML += `
    <article class="patientCard" data-id="${patient.id}">
        <h3>${data.name}</h3>
        <p>${data.email}</p>
        <p>Registros: ${recordsCount}</p>
        <p>Último registro: ${lastRecordDate ? lastRecordDate.toLocaleDateString("es-ES") : "Sin registros"}</p>
    </article>
`;
}

            document.querySelectorAll(".patientCard").forEach((card) => {
                card.addEventListener("click", function() {
                    const patientId = card.dataset.id;
                    window.location.href = `patient.html?id=${patientId}`;
                });
            });
        }
    });

    document.querySelector("#logout").addEventListener("click", async function() {
        await signOut(auth);
        window.location.href = "login.html";
    });
</script>
        <script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>
    </body>
</html>
