<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arte Y Psicologia</title>

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Arte Y Psicologia</h1>
            <p>Inicia sesión para continuar</p>
        </header>

        <button id="googleLogin">
            Continuar con Google
        </button>

    </main>

    <script type="module" src="firebase.js"></script>
<script type="module">
    import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged } 
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import { doc, getDoc, setDoc }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    import { auth, db } from "./firebase.js";

    const provider = new GoogleAuthProvider();



    document.querySelector("#googleLogin").addEventListener("click", async function() {
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
console.log("USUARIO GOOGLE:", user.displayName, user.email);
            const userRef = doc(db, "users", user.uid);
            const userDoc = await getDoc(userRef);
console.log("DOCUMENTO EXISTE:", userDoc.exists());
            if (!userDoc.exists()) {
    await setDoc(userRef, {
        name: user.displayName,
        email: user.email,
        role: "user"
    });

    console.log("DOCUMENTO CREADO");
}

window.location.href = "patients.html";

        } catch (error) {
            console.error("Error al iniciar sesión:", error);
        }
    });
</script>
</body>
</html>
